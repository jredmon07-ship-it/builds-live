<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Builds — Jonathan Redmon</title>
<meta name="description" content="Live portfolio builds. Two hand-built static sites, no frameworks, no build step.">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230b0c0e'/%3E%3Cpath d='M8 22V10h3l5 8 5-8h3v12' stroke='%23c9a227' stroke-width='2' fill='none'/%3E%3C/svg%3E">
<style>
  :root{--bg:#0b0c0e;--tx:#ece9e3;--tx2:#8f8d88;--line:#22242a;--accent:#c9a227}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);
    font:400 16px/1.6 ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center;
    min-height:100vh;min-height:100dvh;padding:8vh 6vw}
  main{width:100%;max-width:44rem}
  .eyebrow{font-size:.68rem;letter-spacing:.28em;text-transform:uppercase;color:var(--tx2);margin:0 0 1.6rem}
  h1{font-size:clamp(1.7rem,5vw,2.6rem);line-height:1.15;font-weight:500;margin:0 0 .7rem;letter-spacing:-.01em}
  .lede{color:var(--tx2);margin:0 0 3rem;max-width:34rem}
  ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
  li{border-bottom:1px solid var(--line)}
  a.build{display:flex;flex-wrap:wrap;align-items:baseline;gap:.4rem 1rem;
    padding:1.4rem .25rem;color:inherit;text-decoration:none;transition:padding-left .35s cubic-bezier(.23,1,.32,1)}
  a.build:hover,a.build:focus-visible{padding-left:.85rem}
  a.build:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  .name{font-size:1.12rem;font-weight:500}
  .kind{color:var(--tx2);font-size:.82rem;flex:1 1 auto}
  .go{color:var(--accent);font-size:.76rem;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
  footer{margin-top:3rem;color:var(--tx2);font-size:.8rem}
  footer a{color:var(--tx2)}
</style>
<main>
  <p class="eyebrow">Jonathan Redmon</p>
  <h1>Builds</h1>
  <p class="lede">Two static sites, built by hand — no framework, no build step. Both are
    demonstration brands, not real businesses.</p>
  <ul>
    <li><a class="build" href="hale-group/">
      <span class="name">The Hale Group</span>
      <span class="kind">Coastal California real estate</span>
      <span class="go">View &rarr;</span></a></li>
    <li><a class="build" href="halden-watch/">
      <span class="name">Halden Watch Co.</span>
      <span class="kind">Mechanical watchmaker</span>
      <span class="go">View &rarr;</span></a></li>
  </ul>
  <footer>Source for both sites lives in
    <a href="https://github.com/jredmon07-ship-it/builds-live">this repository</a>.</footer>
</main>
